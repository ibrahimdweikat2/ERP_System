; Production PHP settings for the ERP API container.
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Asia/Hebron

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code only changes by rebuilding the image, so file timestamps need not be checked.
opcache.validate_timestamps = 0
