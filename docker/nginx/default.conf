# One origin for everything, as in development: the React app, /api and /sanctum (Laravel),
# and /storage (product images). Same origin keeps Sanctum's session cookies working.

# Behind the HTTPS proxy (Caddy on Azure): tell Laravel the original request was HTTPS.
map $http_x_forwarded_proto $erp_https {
    default "";
    https   on;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 30m;

    # Trust X-Forwarded-For only from containers on the Docker network (the HTTPS proxy),
    # so Laravel sees the visitor's address for login throttling and the audit log.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Laravel: every API request goes to public/index.php in the app container.
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $erp_https if_not_empty;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 300;
    }

    # Laravel health check.
    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }

    # Uploaded product images, read straight from the shared storage volume.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 7d;
        access_log off;
    }

    # Built assets have hashed names, so they can be cached for good.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # React routes such as /sales/pos are handled in the browser.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
