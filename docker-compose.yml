# «دفتر» on Docker: MySQL, the Laravel API (php-fpm), queue workers, the scheduler and Nginx.
# Settings live in .env next to this file (copy .env.docker.example). Only Nginx is published.
name: daftar

x-laravel: &laravel
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: daftar-api
  env_file: ${ERP_ENV_FILE:-.env}
  environment:
    ERP_ROLE: worker
  volumes:
    - erp-storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: ${APP_TIMEZONE:-Asia/Hebron}
    # The schema protects posted documents with triggers, which binary logging otherwise refuses.
    command: ["mysqld", "--log-bin-trust-function-creators=1", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - erp-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    <<: *laravel
    environment:
      ERP_ROLE: app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  queue:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "database", "--queue=default,exports,notifications", "--sleep=3", "--tries=2", "--timeout=300", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  maintenance:
    <<: *laravel
    command: ["php", "artisan", "queue:work", "database", "--queue=maintenance", "--sleep=10", "--tries=1", "--timeout=1800", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *laravel
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: daftar-web
    restart: unless-stopped
    ports:
      - "${ERP_HTTP_PORT:-80}:80"
    volumes:
      - erp-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  erp-mysql:
  erp-storage:
