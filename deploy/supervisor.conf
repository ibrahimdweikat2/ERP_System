[program:erp-default]
command=/usr/bin/php /srv/erp/backend/artisan queue:work database --queue=default --tries=3 --timeout=60 --sleep=2 --max-time=3600
directory=/srv/erp/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=370
redirect_stderr=true
stdout_logfile=/var/log/erp-default.log

[program:erp-reports]
command=/usr/bin/php /srv/erp/backend/artisan queue:work database --queue=reports,exports --tries=2 --timeout=300 --sleep=3 --max-time=3600
directory=/srv/erp/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=370
redirect_stderr=true
stdout_logfile=/var/log/erp-reports.log

[program:erp-notifications]
command=/usr/bin/php /srv/erp/backend/artisan queue:work database --queue=notifications,maintenance --tries=5 --timeout=120 --sleep=3 --max-time=3600
directory=/srv/erp/backend
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=370
redirect_stderr=true
stdout_logfile=/var/log/erp-notifications.log
