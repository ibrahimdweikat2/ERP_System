; «دفتر» PHP settings (installed by deploy/aws/install.sh as /etc/php.d/99-daftar.ini).
memory_limit = 512M
upload_max_filesize = 25M
post_max_size = 30M
max_execution_time = 120
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = Asia/Hebron

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; deploy.sh reloads PHP-FPM after each update, so file timestamps need not be checked.
opcache.validate_timestamps = 0
