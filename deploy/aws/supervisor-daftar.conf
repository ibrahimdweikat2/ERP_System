; «دفتر» background processes (installed by deploy/aws/install.sh as /etc/supervisor/conf.d/daftar.conf).
; They run as "apache", the same user as PHP-FPM, so files they write stay readable by the web app.
; Manage with:  sudo supervisorctl status | sudo supervisorctl restart daftar:*

[group:daftar]
programs=daftar-queue,daftar-maintenance,daftar-scheduler

; Reports, exports and notifications.
[program:daftar-queue]
command=/usr/bin/php __APP_DIR__/backend/artisan queue:work database --queue=default,exports,notifications --sleep=3 --tries=2 --timeout=300 --max-time=3600
directory=__APP_DIR__/backend
user=apache
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=330
redirect_stderr=true
stdout_logfile=/var/log/supervisor/daftar-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Nightly backup and other long maintenance jobs.
[program:daftar-maintenance]
command=/usr/bin/php __APP_DIR__/backend/artisan queue:work database --queue=maintenance --sleep=10 --tries=1 --timeout=1800 --max-time=3600
directory=__APP_DIR__/backend
user=apache
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=1860
redirect_stderr=true
stdout_logfile=/var/log/supervisor/daftar-maintenance.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; Laravel scheduler (hourly alerts, 02:00 backup, export cleanup).
[program:daftar-scheduler]
command=/usr/bin/php __APP_DIR__/backend/artisan schedule:work
directory=__APP_DIR__/backend
user=apache
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/daftar-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
