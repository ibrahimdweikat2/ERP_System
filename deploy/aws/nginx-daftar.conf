# «دفتر» on Amazon Linux 2023 (installed by deploy/aws/install.sh as /etc/nginx/conf.d/daftar.conf).
# One origin: the built React app, /api and /sanctum (Laravel via PHP-FPM), /storage (product images).
# __DOMAIN__ and __APP_DIR__ are filled in by install.sh. certbot adds the HTTPS part later.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;
    client_max_body_size 30m;

    root __APP_DIR__/frontend/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Laravel: every API request goes to backend/public/index.php.
    location ~ ^/(api|sanctum)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT __APP_DIR__/backend/public;
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_read_timeout 300;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME __APP_DIR__/backend/public/index.php;
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Uploaded product images.
    location /storage/ {
        alias __APP_DIR__/backend/storage/app/public/;
        expires 7d;
        access_log off;
    }

    # Built assets have hashed names, so they can be cached for good.
    location /assets/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    # React routes such as /sales/pos are handled in the browser.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Never serve dotfiles such as .env or .git.
    location ~ /\. {
        deny all;
    }
}
